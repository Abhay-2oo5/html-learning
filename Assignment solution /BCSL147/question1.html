<!DOCTYPE html>
<html lang="en">
<head>
  <title>Colored Web Page</title>
  <style>
        /* This sets the background color for the entire page */
        body {
            background-color: lightblue;
        }
        /* This sets the color specifically for the title (h1) */
        h1 {
            color: red;
        }
   </style>
</head>
<body>
    <h1>Welcome to My Colored Page</h1>
    <p>The background is blue and the title is red!</p>
</body>
</html>
