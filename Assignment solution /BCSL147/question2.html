<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        td:first-child {
            font-weight: bold;
            color: #555;
            width: 40%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Personal Details</h2>
        <table>
            <tr>
                <td>Name</td>
                <td>John Doe</td>
            </tr>
            <tr>
                <td>Enrolment Number</td>
                <td>ENR123456</td>
            </tr>
            <tr>
                <td>Address</td>
                <td>123, Green Street, Springfield</td>
            </tr>
            <tr>
                <td>Contact</td>
                <td>+91 9876543210</td>
            </tr>
        </table>
    </div>
</body>
</html>
